[project]
name = "saeb-alfab"
version = "0.2.0"
description = "Preditores da alfabetização e da proficiência em LP — Saeb 2023, 2º ano EF (TCC UFPB)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.3.3",
  "numpy>=2.0",
  "scipy",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "lightgbm==4.7.0",
  "shap==0.52.0",
  "lime==0.2.0.1",
  "matplotlib",
  "openpyxl",
  "requests",
  "certifi",
  "joblib",
  "jinja2",
]

[dependency-groups]
dev = ["pytest", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saeb_alfab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dados: exige os microdados em data/raw (lento)"]
